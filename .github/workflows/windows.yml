name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Run core tests with race detection
        run: go test -race -buildvcs=false ./internal/...

  windows:
    name: Windows build and resource tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and verify Windows EXEs
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/package_release.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/package_release.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: LazarusBinder-windows-x64
          path: |
            dist/LazarusBinder-v*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: [core, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: LazarusBinder-windows-x64
          path: release
      - name: Publish Windows ZIP and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/LazarusBinder-v*-windows-x64.zip release/SHA256SUMS.txt \
            --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "LazarusBinder $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

