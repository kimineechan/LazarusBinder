name: Bug report
description: Report a reproducible LazarusBinder problem.
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LazarusBinder version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: 'Windows 11, version and build number'
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Affected section
      options:
        - Bundle creation
        - Combined EXE startup
        - Set bundle icon
        - Extract icons
        - Source build or release workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include launch order and the combined EXE administrator setting if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text or useful screenshots
      description: Include the exact error message if one appeared.

